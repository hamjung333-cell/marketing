<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>퍼널웍스 편집기</title><meta name="claude:viewport-fit-sides" content="cover"><style id="site-css">@import url("https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap");
/* Layout: 광고 리포트 화면처럼 — 왼쪽 정렬 헤드라인 + 숫자 패널, 표·눈금선 그리드로 섹션을 구획 */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #0E1726;
  --muted: #5A6475;
  --line: #D7DCE4;
  --accent: #2346E8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FD;
  --up: #0F8A5F;
  --down: #C2410C;
  --font-display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --wrap: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B111C; --surface: #121A28; --ink: #E8ECF3; --muted: #94A0B4; --line: #253047;
    --accent: #6E86FF; --accent-ink: #0B111C; --accent-soft: #1B2547; --up: #3CCB93; --down: #FB8A50;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B111C; --surface: #121A28; --ink: #E8ECF3; --muted: #94A0B4; --line: #253047;
  --accent: #6E86FF; --accent-ink: #0B111C; --accent-soft: #1B2547; --up: #3CCB93; --down: #FB8A50;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; word-break: keep-all;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.wrap {
  max-width: var(--wrap); margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: clamp(1.75rem, 3.6vw, 2.6rem); font-weight: 900; line-height: 1.2; }
h3 { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
p { margin: 0; }
.eyebrow {
  font-family: var(--font-data); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); font-weight: 500;
}
.lead { color: var(--muted); font-size: 1.05rem; max-width: 60ch; }
section { padding-block: clamp(64px, 9vw, 112px); border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 14px; margin-bottom: clamp(32px, 5vw, 56px); max-width: 720px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 4px;
  font: 600 0.98rem/1 var(--font-body); text-decoration: none; cursor: pointer; border: 1px solid transparent;
  transition: transform .15s ease, background .15s ease;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { transform: translateY(-1px); }
.btn-ghost { border-color: var(--line); color: var(--ink); background: transparent; }
.btn-ghost:hover { border-color: var(--ink); }

/* Header */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; text-decoration: none; letter-spacing: -0.02em; }
.logo-mark { width: 22px; height: 22px; display: block; }
.nav-links { display: flex; gap: 28px; font-size: 0.93rem; color: var(--muted); }
.nav-links a { text-decoration: none; }
.nav-links a:hover { color: var(--ink); }
.nav .btn { padding: 10px 16px; font-size: 0.9rem; }
@media (max-width: 860px) { .nav-links { display: none; } }

/* Hero */
.hero { padding-block: clamp(48px, 8vw, 96px) clamp(56px, 8vw, 96px); border-top: 0; }
.hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(32px, 5vw, 64px); align-items: center; }
.hero-grid > * { min-width: 0; }
.hero h1 { font-size: clamp(2.3rem, 5.6vw, 4.3rem); font-weight: 900; line-height: 1.12; letter-spacing: -0.035em; margin-top: 18px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { margin-top: 22px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero-proof { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 36px; font-size: 0.85rem; color: var(--muted); }
.hero-proof span::before { content: "✓"; color: var(--up); margin-right: 6px; font-weight: 700; }
@media (max-width: 920px) { .hero-grid { grid-template-columns: 1fr; } }

/* Report panel */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 60px -32px rgb(14 23 38 / 0.35); overflow: hidden; }
.report-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.kpi { padding: 16px 18px; display: grid; gap: 2px; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi small { font-size: 0.72rem; color: var(--muted); font-family: var(--font-data); letter-spacing: 0.04em; }
.kpi b { font-family: var(--font-data); font-size: clamp(1.15rem, 2.4vw, 1.5rem); font-weight: 600; font-variant-numeric: tabular-nums; }
.delta { font-family: var(--font-data); font-size: 0.75rem; }
.delta.up { color: var(--up); } .delta.down { color: var(--up); }
.chart { padding: 14px 18px 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart-cap { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 0.7rem; color: var(--muted); padding: 0 18px 10px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th, td { padding: 9px 18px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-family: var(--font-data); font-size: 0.72rem; letter-spacing: 0.04em; }
td { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--font-body); font-weight: 500; }
.sample-note { font-size: 0.72rem; color: var(--muted); padding: 10px 18px; border-top: 1px solid var(--line); }

/* Logos strip */
.channels-strip { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; padding-block: 22px; border-top: 1px solid var(--line); font-family: var(--font-data); font-size: 0.82rem; color: var(--muted); }
.channels-strip strong { color: var(--ink); font-weight: 500; }

/* Services */
.svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.svc { padding: 28px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.svc:nth-child(3n) { border-right: 0; }
.svc:nth-last-child(-n+3) { border-bottom: 0; }
.svc p { color: var(--muted); font-size: 0.95rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-family: var(--font-data); font-size: 0.72rem; padding: 3px 8px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
.svc-kpi { font-family: var(--font-data); font-size: 0.8rem; color: var(--ink); padding-top: 12px; border-top: 1px dashed var(--line); }
.svc-kpi span { color: var(--muted); }
@media (max-width: 920px) {
  .svc-grid { grid-template-columns: 1fr 1fr; }
  .svc:nth-child(3n) { border-right: 1px solid var(--line); }
  .svc:nth-child(2n) { border-right: 0; }
  .svc:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
  .svc:nth-last-child(-n+2) { border-bottom: 0; }
}
@media (max-width: 600px) {
  .svc-grid { grid-template-columns: 1fr; }
  .svc, .svc:nth-child(3n) { border-right: 0; }
  .svc:nth-last-child(-n+2) { border-bottom: 1px solid var(--line); }
  .svc:last-child { border-bottom: 0; }
}

/* Process */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; counter-reset: step; }
.step { padding: 22px 20px 0 0; border-top: 2px solid var(--ink); display: grid; gap: 10px; align-content: start; min-width: 0; }
.step + .step { padding-left: 20px; border-left: 1px solid var(--line); }
.step-no { font-family: var(--font-data); font-size: 0.78rem; color: var(--accent); }
.step p { font-size: 0.92rem; color: var(--muted); }
.step .when { font-family: var(--font-data); font-size: 0.75rem; color: var(--ink); }
@media (max-width: 920px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .step, .step + .step { padding: 18px 0; border-left: 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 2px solid var(--ink); }
}

/* Simulator */
.sim { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sim > * { min-width: 0; }
.sim-in { padding: clamp(22px, 3vw, 36px); display: grid; gap: 22px; border-right: 1px solid var(--line); }
.field { display: grid; gap: 8px; }
.field-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.field label { font-weight: 600; font-size: 0.93rem; }
.field output { font-family: var(--font-data); font-size: 0.95rem; font-weight: 600; }
.field .hint { font-size: 0.78rem; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.sim-out { padding: clamp(22px, 3vw, 36px); display: grid; gap: 22px; align-content: start; background: var(--accent-soft); }
.big-roas { display: grid; gap: 4px; }
.big-roas small { font-family: var(--font-data); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
.big-roas b { font-family: var(--font-data); font-weight: 600; font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.out-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.out-grid div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.out-grid small { font-size: 0.78rem; color: var(--muted); }
.out-grid b { font-family: var(--font-data); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.verdict { font-size: 0.92rem; padding: 12px 14px; border-radius: 4px; background: var(--surface); border-left: 3px solid var(--accent); }
.sim-note { font-size: 0.78rem; color: var(--muted); }
@media (max-width: 860px) { .sim { grid-template-columns: 1fr; } .sim-in { border-right: 0; border-bottom: 1px solid var(--line); } }

/* Cases */
.cases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.case-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.case-meta span:last-child { font-family: var(--font-data); }
.case-metric { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; padding-block: 14px; border-block: 1px solid var(--line); }
.case-metric div { display: grid; gap: 2px; }
.case-metric small { font-size: 0.72rem; color: var(--muted); font-family: var(--font-data); }
.case-metric b { font-family: var(--font-data); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.case-metric .after b { color: var(--accent); }
.case-metric .arrow { color: var(--muted); font-family: var(--font-data); padding-bottom: 4px; }
.case ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.9rem; display: grid; gap: 4px; }
.cases-note { margin-top: 16px; font-size: 0.8rem; color: var(--muted); }
@media (max-width: 920px) { .cases { grid-template-columns: 1fr; } }

/* Pricing */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px; display: grid; gap: 18px; min-width: 0; }
.plan.pick { border: 2px solid var(--accent); }
.plan-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { font-family: var(--font-data); font-size: 0.7rem; background: var(--accent); color: var(--accent-ink); padding: 3px 8px; border-radius: 3px; }
.price { font-family: var(--font-data); font-size: 1.9rem; font-weight: 600; line-height: 1.1; }
.price small { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
.plan .for { color: var(--muted); font-size: 0.9rem; }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.92rem; }
.plan li { display: flex; gap: 10px; }
.plan li::before { content: "—"; color: var(--accent); flex: none; }
.plan .btn { justify-content: center; }
@media (max-width: 920px) { .plans { grid-template-columns: 1fr; } }

/* FAQ */
.faq { display: grid; border-top: 1px solid var(--line); max-width: 860px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; list-style: none; padding: 20px 40px 20px 0; font-weight: 600; font-size: 1.02rem; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 4px; top: 16px; font-family: var(--font-data); font-size: 1.3rem; color: var(--accent); transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { padding-bottom: 22px; color: var(--muted); max-width: 68ch; }

/* Contact */
.contact { background: var(--ink); color: var(--bg); border-top: 0; }
.contact .eyebrow { color: color-mix(in srgb, var(--accent) 55%, var(--bg)); }
.contact-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(32px, 5vw, 72px); }
.contact-grid > * { min-width: 0; }
.contact .lead { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); margin-top: 18px; }
.contact-info { margin-top: 32px; display: grid; gap: 14px; font-size: 0.95rem; }
.contact-info div { display: grid; gap: 2px; }
.contact-info small { font-family: var(--font-data); font-size: 0.75rem; color: color-mix(in srgb, var(--bg) 60%, var(--ink)); letter-spacing: 0.05em; }
.contact-info span { user-select: all; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
form .full { grid-column: 1 / -1; }
.f { display: grid; gap: 6px; min-width: 0; }
.f label { font-size: 0.85rem; font-weight: 500; }
.f input, .f select, .f textarea {
  width: 100%; font: inherit; font-size: 0.95rem; padding: 12px 14px; border-radius: 4px;
  border: 1px solid color-mix(in srgb, var(--bg) 22%, var(--ink)); background: color-mix(in srgb, var(--bg) 6%, var(--ink)); color: var(--bg);
}
.f textarea { min-height: 110px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.85rem; color: color-mix(in srgb, var(--bg) 75%, var(--ink)); }
.check input { margin-top: 4px; accent-color: var(--accent); }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.form-msg { font-size: 0.9rem; }
.form-msg.err { color: var(--down); }
.form-msg.ok { color: var(--up); }
@media (max-width: 860px) { .contact-grid { grid-template-columns: 1fr; } }
@media (max-width: 520px) { form { grid-template-columns: 1fr; } }

/* Footer */
footer { background: var(--ink); color: color-mix(in srgb, var(--bg) 60%, var(--ink)); font-size: 0.8rem; }
footer .wrap { padding-block: 28px; border-top: 1px solid color-mix(in srgb, var(--bg) 15%, var(--ink)); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

/* Header: 로그인·회원가입 */
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-actions { display: flex; align-items: center; gap: 14px; font-size: 0.93rem; }
.nav-text { text-decoration: none; color: var(--muted); white-space: nowrap; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
.nav-text:hover { color: var(--ink); }
.nav-actions .btn { white-space: nowrap; }
@media (max-width: 600px) { .nav-cta { display: none; } }

/* 회원가입·로그인 창 */
.auth {
  width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; overflow: auto;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  box-shadow: 0 30px 80px -30px rgb(14 23 38 / 0.5);
}
.auth::backdrop { background: rgb(14 23 38 / 0.55); backdrop-filter: blur(2px); }
.auth-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 0; }
.auth-head h2 { font-size: 1.45rem; }
.auth-x { border: 0; background: none; color: var(--muted); font-size: 1.8rem; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
.auth-x:hover { color: var(--ink); }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 24px 0; border-bottom: 1px solid var(--line); }
.auth-tabs button { border: 0; background: none; font: 600 0.95rem var(--font-body); color: var(--muted); padding: 10px 0 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.auth-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.auth-form { padding: 20px 24px 24px; gap: 14px; }
.auth-lead { grid-column: 1 / -1; font-size: 0.9rem; color: var(--muted); }
.auth .f input { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.auth .hint { font-size: 0.75rem; color: var(--muted); }
.auth .check { color: var(--muted); }
.auth-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 4px; }
.auth-foot .form-msg { flex-basis: 100%; }
.auth-link { font-size: 0.88rem; color: var(--muted); }
.auth-link:hover { color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; transform: none; }

/* 마이페이지 */
.mp { padding-block: clamp(40px, 7vw, 80px); border-top: 0; }
.mp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; }
.mp-grid > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 16px; align-content: start; }
.panel h3 { font-size: 1.05rem; }
.panel form { grid-template-columns: 1fr; gap: 12px; }
.panel .f input { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.panel .f input[readonly] { color: var(--muted); }
.panel .check { color: var(--muted); }
.mp-wide { grid-column: 1 / -1; }

v class=\"hero-cta\">\n          \u003ca class=\"btn btn-primary\" href=\"#contact\">무료 광고 계정 진단 받기 →\u003c/a>\n          \u003ca class=\"btn btn-ghost\" href=\"#simulator\">예상 ROAS 계산해보기\u003c/a>\n        \u003c/div>\n        \u003cdiv class=\"hero-proof\">\n          \u003cspan>최소 계약기간 없음\u003c/span>\n          \u003cspan>광고 계정 소유권은 광고주에게\u003c/span>\n          \u003cspan>주간 리포트 제공\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"report\" aria-label=\"캠페인 리포트 예시\">\n        \u003cdiv class=\"report-top\">\n          \u003cspan>캠페인 리포트 · 뷰티 D2C 브랜드\u003c/span>\n          \u003cspan class=\"live\">\u003ci>\u003c/i>최근 8주\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"kpis\">\n          \u003cdiv class=\"kpi\">\u003csmall>ROAS\u003c/small>\u003cb>412%\u003c/b>\u003cspan class=\"delta up\">▲ 186%p\u003c/span>\u003c/div>\n          \u003cdiv class=\"kpi\">\u003csmall>CPA\u003c/small>\u003cb>₩11,840\u003c/b>\u003cspan class=\"delta down\">▼ 38.2%\u003c/span>\u003c/div>\n          \u003cdiv class=\"kpi\">\u003csmall>전환수\u003c/small>\u003cb>2,914\u003c/b>\u003cspan class=\"delta up\">▲ 2.3배\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"chart\">\n          \u003csvg viewBox=\"0 0 400 120\" role=\"img\" aria-label=\"8주간 ROAS 추이: 226%에서 412%로 상승\">\n            \u003cg stroke=\"var(--line)\" stroke-width=\"1\">\n              \u003cline x1=\"0\" y1=\"20\" x2=\"400\" y2=\"20\">\u003c/line>\u003cline x1=\"0\" y1=\"60\" x2=\"400\" y2=\"60\">\u003c/line>\u003cline x1=\"0\" y1=\"100\" x2=\"400\" y2=\"100\">\u003c/line>\n            \u003c/g>\n            \u003cg font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" fill=\"var(--muted)\">\n              \u003ctext x=\"2\" y=\"16\">450%\u003c/text>\u003ctext x=\"2\" y=\"56\">300%\u003c/text>\u003ctext x=\"2\" y=\"96\">150%\u003c/text>\n            \u003c/g>\n            \u003c!-- y = 100 - (roas-150)/300*80 ; x 매주 50px 간격 -->\n            \u003cpath d=\"M25,80.3 L75,78.4 L125,69.3 L175,62.1 L225,50.4 L275,43.7 L325,35.7 L375,30.1 L375,110 L25,110 Z\" fill=\"var(--accent)\" opacity=\"0.12\">\u003c/path>\n            \u003cpolyline points=\"25,80.3 75,78.4 125,69.3 175,62.1 225,50.4 275,43.7 325,35.7 375,30.1\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\u003c/polyline>\n            \u003ccircle cx=\"375\" cy=\"30.1\" r=\"4.5\" fill=\"var(--accent)\" stroke=\"var(--surface)\" stroke-width=\"2\">\u003c/circle>\n          \u003c/svg>\n        \u003c/div>\n        \u003cdiv class=\"chart-cap\">\u003cspan>1주차 226%\u003c/span>\u003cspan>운영 시작 → 8주차 412%\u003c/span>\u003c/div>\n        \u003cdiv class=\"tbl-wrap\">\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>매체\u003c/th>\u003cth>광고비\u003c/th>\u003cth>CPA\u003c/th>\u003cth>ROAS\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>메타\u003c/td>\u003ctd>₩18.4M\u003c/td>\u003ctd>₩10,920\u003c/td>\u003ctd>458%\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>네이버 검색\u003c/td>\u003ctd>₩8.2M\u003c/td>\u003ctd>₩9,650\u003c/td>\u003ctd>497%\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>구글 PMax\u003c/td>\u003ctd>₩6.1M\u003c/td>\u003ctd>₩14,380\u003c/td>\u003ctd>331%\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>카카오 모먼트\u003c/td>\u003ctd>₩1.8M\u003c/td>\u003ctd>₩17,200\u003c/td>\u003ctd>264%\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cp class=\"sample-note\">예시 데이터입니다. 실제 고객사 수치로 교체해 사용하세요.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"wrap channels-strip\" aria-label=\"운영 매체\">\n    \u003cstrong>운영 매체\u003c/strong>\n    \u003cspan>Meta 광고\u003c/span>\u003cspan>Google Ads\u003c/span>\u003cspan>네이버 검색광고·GFA\u003c/span>\u003cspan>카카오 모먼트\u003c/span>\u003cspan>TikTok For Business\u003c/span>\u003cspan>당근 비즈니스\u003c/span>\u003cspan>쿠팡 광고\u003c/span>\n  \u003c/div>\n\n  \u003c!-- Services -->\n  \u003csection id=\"services\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">Services\u003c/p>\n        \u003ch2>매체 운영부터 소재, 측정까지\u003cbr>한 팀이 맡습니다.\u003c/h2>\n        \u003cp class=\"lead\">매체마다 대행사를 따로 두면 예산이 서로 경쟁합니다. 퍼널 전체를 보고 어디에 돈을 더 쓸지 정합니다.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"svc-grid\">\n        \u003carticle class=\"svc\">\n          \u003ch3>SNS 광고 운영\u003c/h3>\n          \u003cp>메타·틱톡 캠페인 구조 설계, 오디언스 테스트, 예산 배분을 맡습니다. 어드밴티지+ 쇼핑 캠페인 운영 경험이 많습니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">Meta\u003c/span>\u003cspan class=\"tag\">TikTok\u003c/span>\u003cspan class=\"tag\">ASC+\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> ROAS · CPA · 구매 전환율\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"svc\">\n          \u003ch3>검색 광고 운영\u003c/h3>\n          \u003cp>네이버 파워링크·쇼핑검색, 구글 검색·PMax를 운영합니다. 키워드 입찰은 전환 데이터 기준으로 매일 조정합니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">네이버 SA\u003c/span>\u003cspan class=\"tag\">Google Search\u003c/span>\u003cspan class=\"tag\">PMax\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> 전환당 비용 · 노출 점유율\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"svc\">\n          \u003ch3>DB·리드 수집\u003c/h3>\n          \u003cp>병원, 교육, 분양, 보험처럼 상담 신청이 목표인 업종을 위해 리드폼과 랜딩페이지를 함께 설계합니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">리드폼\u003c/span>\u003cspan class=\"tag\">카카오 비즈폼\u003c/span>\u003cspan class=\"tag\">GFA\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> CPL · 유효 DB 비율\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"svc\">\n          \u003ch3>광고 소재 제작\u003c/h3>\n          \u003cp>주 단위로 이미지·숏폼 소재를 만들고 A/B 테스트합니다. 첫 3초 훅과 카피를 가설 단위로 검증합니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">숏폼\u003c/span>\u003cspan class=\"tag\">배너\u003c/span>\u003cspan class=\"tag\">UGC\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> CTR · 3초 시청률 · 소재 피로도\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"svc\">\n          \u003ch3>측정·트래킹 세팅\u003c/h3>\n          \u003cp>픽셀, 전환 API, GA4, 앱 MMP를 점검하고 다시 세팅합니다. 숫자가 틀리면 최적화도 틀리기 때문입니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">GA4\u003c/span>\u003cspan class=\"tag\">CAPI\u003c/span>\u003cspan class=\"tag\">GTM\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> 전환 매칭률 · 이벤트 품질\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"svc\">\n          \u003ch3>랜딩페이지 개선\u003c/h3>\n          \u003cp>광고를 클릭한 뒤 이탈하는 구간을 찾아 상세페이지와 랜딩 구조를 고칩니다. 히트맵과 퍼널 데이터를 기준으로 합니다.\u003c/p>\n          \u003cdiv class=\"tags\">\u003cspan class=\"tag\">CRO\u003c/span>\u003cspan class=\"tag\">히트맵\u003c/span>\u003cspan class=\"tag\">A/B\u003c/span>\u003c/div>\n          \u003cp class=\"svc-kpi\">\u003cspan>핵심 지표\u003c/span> 랜딩 전환율 · 이탈률\u003c/p>\n        \u003c/article>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Process -->\n  \u003csection id=\"process\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">Process\u003c/p>\n        \u003ch2>첫 상담부터 첫 리포트까지 2주\u003c/h2>\n        \u003cp class=\"lead\">계약 전 진단은 무료입니다. 기존 광고 계정이 있으면 지난 90일 데이터를 먼저 봅니다.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"steps\">\n        \u003cdiv class=\"step\">\u003cspan class=\"step-no\">STEP 1\u003c/span>\u003ch3>계정 진단\u003c/h3>\u003cp>기존 광고 계정과 트래킹 상태를 점검하고 새는 예산을 찾습니다.\u003c/p>\u003cspan class=\"when\">D+0 ~ 3\u003c/span>\u003c/div>\n        \u003cdiv class=\"step\">\u003cspan class=\"step-no\">STEP 2\u003c/span>\u003ch3>목표·예산 설계\u003c/h3>\u003cp>목표 ROAS·CPA를 정하고 매체별 예산 비율과 테스트 계획을 세웁니다.\u003c/p>\u003cspan class=\"when\">D+4 ~ 6\u003c/span>\u003c/div>\n        \u003cdiv class=\"step\">\u003cspan class=\"step-no\">STEP 3\u003c/span>\u003ch3>세팅·소재 제작\u003c/h3>\u003cp>트래킹을 바로잡고 캠페인 구조와 첫 소재 묶음을 준비합니다.\u003c/p>\u003cspan class=\"when\">D+7 ~ 10\u003c/span>\u003c/div>\n        \u003cdiv class=\"step\">\u003cspan class=\"step-no\">STEP 4\u003c/span>\u003ch3>집행·최적화\u003c/h3>\u003cp>학습 기간이 끝나면 성과가 낮은 소재와 세트를 정리하고 예산을 옮깁니다.\u003c/p>\u003cspan class=\"when\">D+11 ~\u003c/span>\u003c/div>\n        \u003cdiv class=\"step\">\u003cspan class=\"step-no\">STEP 5\u003c/span>\u003ch3>주간 리포트\u003c/h3>\u003cp>매주 월요일 지난주 성과와 이번 주 실행 계획을 공유합니다.\u003c/p>\u003cspan class=\"when\">매주 월요일\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Simulator -->\n  \u003csection id=\"simulator\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">ROAS Calculator\u003c/p>\n        \u003ch2>우리 광고, 지금 남는 장사일까?\u003c/h2>\n        \u003cp class=\"lead\">월 광고비와 클릭당 비용, 전환율, 객단가를 넣으면 예상 매출과 ROAS가 나옵니다.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"sim\">\n        \u003cdiv class=\"sim-in\">\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-row\">\u003clabel for=\"budget\">월 광고비\u003c/label>\u003coutput id=\"budgetOut\" class=\"num\" for=\"budget\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"budget\" min=\"1000000\" max=\"100000000\" step=\"1000000\" value=\"10000000\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-row\">\u003clabel for=\"cpc\">평균 CPC (클릭당 비용)\u003c/label>\u003coutput id=\"cpcOut\" class=\"num\" for=\"cpc\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"cpc\" min=\"100\" max=\"3000\" step=\"50\" value=\"600\">\n            \u003cspan class=\"hint\">메타 쇼핑 업종 평균은 대략 400~900원입니다.\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-row\">\u003clabel for=\"cvr\">구매 전환율\u003c/label>\u003coutput id=\"cvrOut\" class=\"num\" for=\"cvr\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"cvr\" min=\"0.2\" max=\"8\" step=\"0.1\" value=\"1.8\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-row\">\u003clabel for=\"aov\">평균 객단가\u003c/label>\u003coutput id=\"aovOut\" class=\"num\" for=\"aov\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"aov\" min=\"10000\" max=\"500000\" step=\"5000\" value=\"45000\">\n          \u003c/div>\n          \u003cdiv class=\"field\">\n            \u003cdiv class=\"field-row\">\u003clabel for=\"margin\">상품 마진율\u003c/label>\u003coutput id=\"marginOut\" class=\"num\" for=\"margin\">\u003c/output>\u003c/div>\n            \u003cinput type=\"range\" id=\"margin\" min=\"10\" max=\"90\" step=\"1\" value=\"40\">\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"sim-out\" aria-live=\"polite\">\n          \u003cdiv class=\"big-roas\">\u003csmall>예상 ROAS\u003c/small>\u003cb id=\"roas\">—\u003c/b>\u003c/div>\n          \u003cdiv class=\"out-grid\">\n            \u003cdiv>\u003csmall>예상 클릭수\u003c/small>\u003cb id=\"clicks\">—\u003c/b>\u003c/div>\n            \u003cdiv>\u003csmall>예상 구매수\u003c/small>\u003cb id=\"orders\">—\u003c/b>\u003c/div>\n            \u003cdiv>\u003csmall>예상 매출\u003c/small>\u003cb id=\"revenue\">—\u003c/b>\u003c/div>\n            \u003cdiv>\u003csmall>CPA (구매당 비용)\u003c/small>\u003cb id=\"cpa\">—\u003c/b>\u003c/div>\n            \u003cdiv>\u003csmall>손익분기 ROAS\u003c/small>\u003cb id=\"bep\">—\u003c/b>\u003c/div>\n            \u003cdiv>\u003csmall>광고 후 남는 이익\u003c/small>\u003cb id=\"profit\">—\u003c/b>\u003c/div>\n          \u003c/div>\n          \u003cp class=\"verdict\" id=\"verdict\">—\u003c/p>\n          \u003cp class=\"sim-note\">단순 계산식 기준 추정치입니다. 실제 성과는 업종, 소재, 시즌에 따라 달라집니다.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Cases -->\n  \u003csection id=\"cases\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">Case Studies\u003c/p>\n        \u003ch2>운영 전과 후, 숫자로 비교합니다.\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"cases\">\n        \u003carticle class=\"case\">\n          \u003cdiv class=\"case-meta\">\u003cspan>뷰티 D2C · 자사몰\u003c/span>\u003cspan>3개월\u003c/span>\u003c/div>\n          \u003ch3>예산은 그대로, 매출은 2.1배\u003c/h3>\n          \u003cdiv class=\"case-metric\">\n            \u003cdiv>\u003csmall>ROAS 전\u003c/small>\u003cb>198%\u003c/b>\u003c/div>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cdiv class=\"after\">\u003csmall>ROAS 후\u003c/small>\u003cb>421%\u003c/b>\u003c/div>\n          \u003c/div>\n          \u003cul>\u003cli>전환 API 재세팅으로 매칭률 41% → 87%\u003c/li>\u003cli>소재 주 12개 테스트, 상위 20%만 증액\u003c/li>\u003c/ul>\n        \u003c/article>\n        \u003carticle class=\"case\">\n          \u003cdiv class=\"case-meta\">\u003cspan>피부과 · 상담 DB\u003c/span>\u003cspan>2개월\u003c/span>\u003c/div>\n          \u003ch3>상담 신청 단가 절반으로\u003c/h3>\n          \u003cdiv class=\"case-metric\">\n            \u003cdiv>\u003csmall>CPL 전\u003c/small>\u003cb>₩48,000\u003c/b>\u003c/div>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cdiv class=\"after\">\u003csmall>CPL 후\u003c/small>\u003cb>₩21,500\u003c/b>\u003c/div>\n          \u003c/div>\n          \u003cul>\u003cli>메타 리드폼에 사전 질문 2개 추가\u003c/li>\u003cli>유효 DB 비율 52% → 78%\u003c/li>\u003c/ul>\n        \u003c/article>\n        \u003carticle class=\"case\">\n          \u003cdiv class=\"case-meta\">\u003cspan>교육 앱 · 설치 캠페인\u003c/span>\u003cspan>4개월\u003c/span>\u003c/div>\n          \u003ch3>유료 전환까지 이어지는 설치\u003c/h3>\n          \u003cdiv class=\"case-metric\">\n            \u003cdiv>\u003csmall>결제당 비용 전\u003c/small>\u003cb>₩62,300\u003c/b>\u003c/div>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cdiv class=\"after\">\u003csmall>결제당 비용 후\u003c/small>\u003cb>₩29,800\u003c/b>\u003c/div>\n          \u003c/div>\n          \u003cul>\u003cli>최적화 이벤트를 설치 → 체험 시작으로 변경\u003c/li>\u003cli>구글 앱 캠페인 + 틱톡 병행\u003c/li>\u003c/ul>\n        \u003c/article>\n      \u003c/div>\n      \u003cp class=\"cases-note\">위 사례는 예시 데이터입니다. 실제 고객사 동의를 받은 수치로 교체해 사용하세요.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Pricing -->\n  \u003csection id=\"pricing\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">Pricing\u003c/p>\n        \u003ch2>월 광고비 규모에 맞춰 고르세요.\u003c/h2>\n        \u003cp class=\"lead\">모든 요금은 VAT 별도이며, 광고비는 광고주 계정에서 매체로 직접 결제됩니다.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"plans\">\n        \u003carticle class=\"plan\">\n          \u003cdiv class=\"plan-head\">\u003ch3>스타트\u003c/h3>\u003c/div>\n          \u003cp class=\"price num\">₩990,000\u003csmall> / 월 고정\u003c/small>\u003c/p>\n          \u003cp class=\"for\">월 광고비 1,000만 원 이하. 처음 광고를 시작하는 브랜드.\u003c/p>\n          \u003cul>\u003cli>매체 2개 운영\u003c/li>\u003cli>월 소재 8개 제작\u003c/li>\u003cli>트래킹 기본 세팅\u003c/li>\u003cli>격주 리포트\u003c/li>\u003c/ul>\n          \u003ca class=\"btn btn-ghost\" href=\"#contact\">상담 신청\u003c/a>\n        \u003c/article>\n        \u003carticle class=\"plan pick\">\n          \u003cdiv class=\"plan-head\">\u003ch3>그로스\u003c/h3>\u003cspan class=\"badge\">가장 많이 선택\u003c/span>\u003c/div>\n          \u003cp class=\"price num\">광고비의 15%\u003csmall> / 최소 ₩1.5M\u003c/small>\u003c/p>\n          \u003cp class=\"for\">월 광고비 1,000만 ~ 1억 원. 매출 확장 단계.\u003c/p>\n          \u003cul>\u003cli>매체 4개까지 운영\u003c/li>\u003cli>월 소재 20개 + 숏폼 4편\u003c/li>\u003cli>전환 API · GA4 고급 세팅\u003c/li>\u003cli>주간 리포트 + 월간 미팅\u003c/li>\u003cli>전담 마케터 1명\u003c/li>\u003c/ul>\n          \u003ca class=\"btn btn-primary\" href=\"#contact\">상담 신청\u003c/a>\n        \u003c/article>\n        \u003carticle class=\"plan\">\n          \u003cdiv class=\"plan-head\">\u003ch3>엔터프라이즈\u003c/h3>\u003c/div>\n          \u003cp class=\"price num\">별도 협의\u003c/p>\n          \u003cp class=\"for\">월 광고비 1억 원 이상, 여러 브랜드나 앱을 운영하는 팀.\u003c/p>\n          \u003cul>\u003cli>전 매체 운영\u003c/li>\u003cli>전담 팀 (마케터·디자이너·애널리스트)\u003c/li>\u003cli>MMM · 증분 테스트 설계\u003c/li>\u003cli>대시보드 연동\u003c/li>\u003c/ul>\n          \u003ca class=\"btn btn-ghost\" href=\"#contact\">상담 신청\u003c/a>\n        \u003c/article>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- FAQ -->\n  \u003csection id=\"faq\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"sec-head\">\n        \u003cp class=\"eyebrow\">FAQ\u003c/p>\n        \u003ch2>자주 묻는 질문\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"faq\">\n        \u003cdetails>\u003csummary>최소 계약 기간이 있나요?\u003c/summary>\u003cp>없습니다. 다만 광고 매체의 학습 기간 때문에 첫 성과 판단은 최소 4주 운영 후에 하시길 권합니다. 해지는 한 달 전에 알려주시면 됩니다.\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary>광고 계정은 누구 소유인가요?\u003c/summary>\u003cp>광고주 소유입니다. 계정은 광고주 명의로 만들고 저희는 관리자 권한만 받습니다. 계약이 끝나도 계정과 데이터는 그대로 남습니다.\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary>성과가 나오지 않으면 어떻게 하나요?\u003c/summary>\u003cp>매주 리포트에서 목표 대비 현황을 공유하고, 8주 안에 목표 ROAS의 70%에 못 미치면 전략을 다시 짭니다. 그래도 개선되지 않으면 다음 달 운영 수수료를 받지 않습니다.\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary>광고 소재도 직접 만들어 주나요?\u003c/summary>\u003cp>네. 플랜에 포함된 수량만큼 이미지와 숏폼 소재를 만듭니다. 촬영이 필요한 경우 별도 견적을 드립니다.\u003c/p>\u003c/details>\n        \u003cdetails>\u003csummary>어떤 업종을 주로 하나요?\u003c/summary>\u003cp>자사몰 커머스, 뷰티, 식품, 병원·에스테틱, 교육, 앱 서비스를 주로 운영합니다. 매체 정책상 광고가 제한되는 업종은 상담 단계에서 먼저 확인해 드립니다.\u003c/p>\u003c/details>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- Contact -->\n  \u003csection id=\"contact\" class=\"contact\">\n    \u003cdiv class=\"wrap contact-grid\">\n      \u003cdiv>\n        \u003cp class=\"eyebrow\">Free Audit\u003c/p>\n        \u003ch2>광고 계정 진단은 무료입니다.\u003c/h2>\n        \u003cp class=\"lead\">신청서를 남겨주시면 영업일 기준 1일 안에 연락드립니다. 진단 리포트는 계약 여부와 상관없이 드립니다.\u003c/p>\n        \u003cdiv class=\"contact-info\">\n          \u003cdiv>\u003csmall>EMAIL\u003c/small>\u003cspan>hello@funnelworks.kr\u003c/span>\u003c/div>\n          \u003cdiv>\u003csmall>TEL\u003c/small>\u003cspan>02-0000-0000\u003c/span>\u003c/div>\n          \u003cdiv>\u003csmall>ADDRESS\u003c/small>\u003cspan>서울특별시 강남구 테헤란로 000, 0층\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cform id=\"leadForm\" novalidate=\"\">\n        \u003cdiv class=\"f\">\u003clabel for=\"company\">회사·브랜드명 *\u003c/label>\u003cinput id=\"company\" name=\"company\" autocomplete=\"organization\" required=\"\">\u003c/div>\n        \u003cdiv class=\"f\">\u003clabel for=\"name\">담당자 이름 *\u003c/label>\u003cinput id=\"name\" name=\"name\" autocomplete=\"name\" required=\"\">\u003c/div>\n        \u003cdiv class=\"f\">\u003clabel for=\"phone\">연락처 *\u003c/label>\u003cinput id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"010-0000-0000\" required=\"\">\u003c/div>\n        \u003cdiv class=\"f\">\u003clabel for=\"email\">이메일\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\">\u003c/div>\n        \u003cdiv class=\"f\">\u003clabel for=\"spend\">월 광고비\u003c/label>\n          \u003cselect id=\"spend\" name=\"spend\">\n            \u003coption>아직 집행 전\u003c/option>\u003coption>1,000만 원 미만\u003c/option>\u003coption selected=\"\">1,000만 ~ 3,000만 원\u003c/option>\u003coption>3,000만 ~ 1억 원\u003c/option>\u003coption>1억 원 이상\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"f\">\u003clabel for=\"goal\">광고 목표\u003c/label>\n          \u003cselect id=\"goal\" name=\"goal\">\n            \u003coption>온라인 매출\u003c/option>\u003coption>상담·DB 수집\u003c/option>\u003coption>앱 설치·가입\u003c/option>\u003coption>브랜드 인지도\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv class=\"f full\">\u003clabel for=\"msg\">현재 고민\u003c/label>\u003ctextarea id=\"msg\" name=\"msg\" placeholder=\"예) ROAS가 200% 밑으로 떨어졌어요. 메타 광고 학습이 자꾸 초기화됩니다.\">\u003c/textarea>\u003c/div>\n        \u003cinput type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\" style=\"position:absolute;left:-9999px;width:1px;height:1px;\">\n        \u003clabel class=\"check full\" for=\"agree\">\u003cinput type=\"checkbox\" id=\"agree\" name=\"agree\"> 개인정보 수집·이용에 동의합니다. (상담 목적, 상담 완료 후 1년 보관)\u003c/label>\n        \u003cdiv class=\"form-foot full\">\n          \u003cbutton class=\"btn btn-primary\" type=\"submit\">무료 진단 신청하기\u003c/button>\n          \u003cp class=\"form-msg\" id=\"formMsg\" role=\"status\">\u003c/p>\n        \u003c/div>\n      \u003c/form>\n    \u003c/div>\n  \u003c/section>\n\u003c/main>\n\n\u003cfooter>\n  \u003cdiv class=\"wrap\">\n    \u003cspan>© 2026 퍼널웍스 · 사업자등록번호 000-00-00000 · 대표 000\u003c/span>\n    \u003cspan>퍼포먼스 마케팅 · 광고 운영 대행\u003c/span>\n  \u003c/div>\n\u003c/footer>","savedAt":"2026-11-08T09:43:53.953Z"}</script><script>
(function () {
  var SCRIPT_TEXT = document.currentScript.textContent;
  var site = document.getElementById("site");
  var state = JSON.parse(document.getElementById("ed-state").textContent);
  var saveBtn = document.getElementById("edSave"), undoBtn = document.getElementById("edUndo"), msg = document.getElementById("edMsg");
  var EDITABLE = "h1,h2,h3,p,li,summary,td,th,label,button,a,strong,b,small,span,em,option";
  var artifact = null, saving = false;

  function render() {
    site.innerHTML = state.html;
    site.querySelectorAll(EDITABLE).forEach(function (el) {
      if (!el.closest("svg") && el.textContent.trim()) el.setAttribute("data-ed-ok", "");
    });
    update();
  }
  function clean() {
    var c = site.cloneNode(true);
    c.querySelectorAll("[contenteditable]").forEach(function (el) { el.removeAttribute("contenteditable"); });
    c.querySelectorAll("[data-ed-ok]").forEach(function (el) { el.removeAttribute("data-ed-ok"); });
    c.querySelectorAll(".ed-changed").forEach(function (el) { el.classList.remove("ed-changed"); if (!el.className) el.removeAttribute("class"); });
    return c.innerHTML;
  }
  var changed = 0;
  function update() {
    var dirty = clean() !== state.html;
    changed = site.querySelectorAll(".ed-changed").length;
    saveBtn.disabled = !dirty || saving || !artifact;
    undoBtn.disabled = !dirty || saving;
    if (saving) msg.innerHTML = "저장하는 중…";
    else if (dirty) msg.innerHTML = "고친 곳 <b>" + changed + "</b>개 · <b>저장</b>을 눌러야 남습니다.";
    else msg.innerHTML = "바꾸고 싶은 글자를 <b>더블클릭</b>해서 고치세요. 다 고치면 저장을 누르세요.";
  }
  function finish(el) {
    if (el.getAttribute("contenteditable") !== "true") return;
    el.removeAttribute("contenteditable");
    if (el.innerHTML !== el.dataset.edBefore) el.classList.add("ed-changed");
    delete el.dataset.edBefore;
    update();
  }

  site.addEventListener("dblclick", function (e) {
    var el = e.target.closest("[data-ed-ok]");
    if (!el || !site.contains(el)) return;
    e.preventDefault();
    if (el.tagName === "SUMMARY") el.parentNode.open = true;
    el.dataset.edBefore = el.innerHTML;
    el.setAttribute("contenteditable", "true");
    el.focus();
    var r = document.createRange(); r.selectNodeContents(el);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
  site.addEventListener("focusout", function (e) { finish(e.target); });
  site.addEventListener("keydown", function (e) {
    if (e.target.getAttribute("contenteditable") !== "true") return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
    if (e.key === "Escape") { e.target.innerHTML = e.target.dataset.edBefore; e.target.blur(); }
    if (e.key === " " && e.target.tagName === "SUMMARY") e.stopPropagation();
  });
  site.addEventListener("keyup", function (e) { if (e.target.tagName === "SUMMARY" && e.target.isContentEditable) e.preventDefault(); });
  site.addEventListener("paste", function (e) {
    if (e.target.closest && e.target.closest("[contenteditable=true]")) {
      e.preventDefault();
      document.execCommand("insertText", false, (e.clipboardData || {getData: function(){return ""}}).getData("text/plain"));
    }
  });
  site.addEventListener("click", function (e) {
    var t = e.target;
    if (t.closest("[contenteditable=true]")) { if (t.closest("summary")) e.preventDefault(); return; }
    var a = t.closest("a");
    if (a) {
      e.preventDefault();
      var h = a.getAttribute("href") || "";
      if (h.charAt(0) === "#") { var dest = h === "#top" ? site : document.getElementById(h.slice(1)); if (dest) dest.scrollIntoView({behavior: "smooth"}); }
    }
    if (t.closest("button")) e.preventDefault();
  });
  site.addEventListener("submit", function (e) { e.preventDefault(); });

  undoBtn.addEventListener("click", function () { render(); });
  saveBtn.addEventListener("click", async function () {
    if (!artifact || saving) return;
    var active = site.querySelector("[contenteditable=true]"); if (active) finish(active);
    state.html = clean();
    state.savedAt = new Date().toISOString();
    saving = true; update();
    try {
      await artifact.publish(buildDoc());
      msg.innerHTML = "저장했습니다.";
    } catch (err) {
      saving = false;
      var code = err && err.code;
      msg.textContent = code === "conflict" ? "다른 곳에서 먼저 저장해서 새로 불러옵니다." :
        (code === "not_granted" || code === "not_writer") ? "이 화면은 보기 전용이라 저장할 수 없습니다." :
        "저장하지 못했습니다. 잠시 후 다시 눌러주세요.";
      saveBtn.disabled = false;
    }
  });

  function esc(s) { return s.replace(/</g, "\\u003c"); }
  function buildDoc() {
    var reset = document.head.querySelector("style");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      (reset ? reset.textContent : "") + "</style></head><body>" +
      "<title>" + document.title + "</title>" +
      document.querySelector("meta[name='claude:viewport-fit-sides']").outerHTML +
      "<style id=\"site-css\">" + document.getElementById("site-css").textContent + "</style>" +
      "<style id=\"ed-css\">" + document.getElementById("ed-css").textContent + "</style>" +
      "<div id=\"site\"></div>" + document.getElementById("edbar").outerHTML +
      "<script type=\"application/json\" id=\"ed-state\">" + esc(JSON.stringify(state)) + "<\/script>" +
      "<script>" + SCRIPT_TEXT + "<\/script></body></html>";
  }

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) { artifact = a; update(); if (!a) msg.textContent = "이 화면에서는 저장할 수 없습니다. claude.ai에서 열어주세요."; });
  }
})();
</script></body></html>
